name: Insider Buying Tracker

on:
  schedule:
    # Tuesday and Friday at 1:00 AM Mountain Time (07:00 UTC)
    - cron: '0 7 * * 2,5'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Form 4 filings
        run: python src/fetch_form4s.py --date $(date +%Y-%m-%d)
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

      - name: Enrich with Polygon data
        run: python src/enrich.py --date $(date +%Y-%m-%d)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

      - name: Generate price charts
        run: python src/fetch_charts.py --date $(date +%Y-%m-%d)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

      - name: Score and rank
        run: python src/score_and_rank.py --date $(date +%Y-%m-%d)

      - name: Generate report
        run: python src/generate_report.py --date $(date +%Y-%m-%d)

      - name: Update performance tracker
        run: python src/update_performance.py --date $(date +%Y-%m-%d)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Update insider buying report $(date +%Y-%m-%d)"
          git push
